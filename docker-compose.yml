services:
  postgres:
    image: postgres:16-alpine
    container_name: trustpass-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trustpass_dev
      POSTGRES_DB: trustpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustpass-backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:trustpass_dev@postgres:5432/trustpass
      JWT_SECRET: ""
      ENCRYPTION_KEY: ""
      ISSUER_PRIVATE_KEY: ""
      ISSUER_PUBLIC_KEY: ""
      ISSUER_NAME: TrustPass Authority
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustpass-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000/api
    depends_on:
      - backend

volumes:
  postgres_data:
